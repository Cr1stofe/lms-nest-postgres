name: veltro-lms

services:
  postgres:
    image: postgres:18-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  node:
    build:
      context: .
      target: prod
    container_name: veltro-lms-node-1
    volumes:
      - files:/files
    env_file:
      - .env
    secrets:
      - email_key
      - pepper
    environment:
      EMAIL_KEY_FILE: /run/secrets/email_key
      PEPPER_FILE: /run/secrets/pepper
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lms}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web_gateway
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  files:
  postgres_data:

networks:
  default:
  web_gateway:
    external: true

secrets:
  email_key:
    file: ./secrets/email_key.txt
  pepper:
    file: ./secrets/pepper.txt
