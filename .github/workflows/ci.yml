name: CI Pipeline

on:
  push:
    branches: [main, feat/*, fix/*, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/lms_test?schema=public
      EMAIL_KEY: test_resend_api_key_placeholder
      PEPPER: test_security_pepper_secret_123456789
      FRONTEND_URL: http://localhost:3000
      SERVER_NAME: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npm run prisma:seed

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Typecheck & Build (TypeScript)
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Run E2E Integration Tests (Vitest + Supertest)
        run: npm run test:e2e
